name: 민원 데이터 받기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 4번만 시험 / run = 본 조회"
        required: true
        default: "test"
        type: choice
        options: [test, run]
      picks:
        description: "test에서 볼 항목 (지역:연도, 쉼표 구분). 비우면 기본 6개"
        required: false
        default: ""
  schedule:
    # 한국시간 01:07, 13:07 (UTC 16:07, 04:07). 하루 2번, 키당 48번씩
    - cron: "7 16 * * *"
    - cron: "7 4 * * *"

permissions:
  contents: write

concurrency:
  group: minwon
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 조회
        env:
          MINWON_KEYS: ${{ secrets.MINWON_KEYS }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          TEST_PICKS: ${{ github.event.inputs.picks || '' }}
          MAX_MINUTES: "300"
          CALLS_PER_KEY: "48"
        run: python fetch.py
      - name: CSV로 합치기
        if: always()
        run: python build_csv.py
      - name: 결과 저장(커밋)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "민원 데이터 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
